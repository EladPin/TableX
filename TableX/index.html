<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>TableX</title>
  <link rel="icon" href="favicon.ico" sizes="any"/>
  <script>
    /* Runs BEFORE any stylesheet paints. Applying theme and direction here
       is what stops a white flash before a dark-mode user's CSS lands, and
       an RTL->LTR jump for an English user. Everything else waits for
       js/i18n.js; this only touches <html> attributes. */
    (function () {
      try {
        var t = localStorage.getItem('tablex_theme');
        if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
        var l = localStorage.getItem('tablex_lang') || 'he';
        document.documentElement.lang = l;
        document.documentElement.dir = l === 'he' ? 'rtl' : 'ltr';
      } catch (e) { document.documentElement.dataset.theme = 'light'; }
    })();
  </script>
  <link rel="stylesheet" href="fonts/fonts.css"/>
  <link rel="stylesheet" href="css/main.css"/>
</head>
<body>

<!-- ══ LOADER ══ covers the async DB fetch; removed by app.js when ready ══ -->
<div class="loader" id="loader">
  <div class="loader-inner">

    <!-- Pixel ghost, adapted from Uiverse.io by moraxh. 14x14 CSS grid at 10px
         a cell; the bottom two rows flicker between two states to wave the
         skirt. Face pieces sit inside .gh-body so they ride the bob. -->
    <div class="gh" aria-hidden="true">
      <div class="gh-shadow"></div>
      <div class="gh-body">
        <i class="t0"></i><i class="t1"></i><i class="t2"></i><i class="t3"></i><i class="t4"></i>
        <i class="s0"></i><i class="s1"></i><i class="s2"></i><i class="s3"></i><i class="s4"></i><i class="s5"></i>
        <i class="a1  f0"></i><i class="a2  f1"></i><i class="a3  f1"></i><i class="a4  f1"></i>
        <i class="a5  f1"></i><i class="a6  f0"></i><i class="a7  f0"></i><i class="a8  f0"></i>
        <i class="a9  f1"></i><i class="a10 f1"></i><i class="a11 f0"></i><i class="a12 f0"></i>
        <i class="a13 f0"></i><i class="a14 f1"></i><i class="a15 f1"></i><i class="a16 f1"></i>
        <i class="a17 f1"></i><i class="a18 f0"></i>
        <span class="gh-pupil"></span><span class="gh-pupil2"></span>
        <span class="gh-m0"></span><span class="gh-m1"></span><span class="gh-m2"></span>
        <span class="gh-m3"></span><span class="gh-m4"></span><span class="gh-m5"></span>
        <span class="gh-m6"></span>
      </div>
    </div>

    <div class="loader-word">TableX</div>
    <div class="loader-track"><div class="loader-bar" id="loaderBar"></div></div>
    <div class="loader-status" id="loaderStatus" data-i18n="loader.status"></div>
  </div>
</div>

<!-- hidden file inputs, reused by every upload -->
<input type="file" id="dbFileInput" accept=".xlsx,.json" hidden/>
<input type="file" id="dbInspectInput" accept=".xlsx" hidden/>
<input type="file" id="tplFileInput" accept=".pptx" hidden/>
<input type="file" id="imgFileInput" accept="image/*" multiple hidden/>

        <rect x="3" y="5" width="2" height="1" fill="var(--paper)"/>
        <rect x="5" y="5" width="4" height="1" fill="currentColor"/>
        <rect x="9" y="5" width="2" height="1" fill="var(--paper)"/>

        <rect x="12" y="9" width="2" height="1" fill="currentColor"/>

        <rect x="1" y="13" width="3" height="1" fill="currentColor"/>

      </svg>
      <span class="brand-word">TableX</span>
    </a>

    <nav class="nav-links">
      <button class="nav-link active" data-goto="home" data-i18n="nav.input"></button>
      <button class="nav-link" data-goto="site" data-i18n="nav.site"></button>
      <button class="nav-link" data-goto="quest" data-i18n="nav.quest"></button>

    </nav>

    <div class="nav-actions">

      <div class="set-wrap">

                  stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>

        <div class="set-pop hidden" id="setPop" role="dialog" aria-label="Settings">

            <p class="set-label" data-i18n="set.theme"></p>
            <div class="seg" id="segTheme">
              <button class="seg-btn" data-set-theme="light" data-i18n="set.light"></button>

          </div>
          <div class="set-group">
            <p class="set-label" data-i18n="set.lang"></p>
            <div class="seg" id="segLang">
              <button class="seg-btn" data-set-lang="he" dir="rtl">עברית</button>
              <button class="seg-btn" data-set-lang="en" dir="ltr">English</button>
            </div>
          </div>
          <div class="set-group">
            <p class="set-label" data-i18n="set.scene"></p>
            <div class="seg" id="segScene">

  </div>
</header>

<!-- ══ HOME ══ -->
<main class="view" id="viewHome">

  <!-- Home is the paste and nothing else. How to get the paste out of
       Planet lives behind the "?" (js/tour.js), not on the page. -->
  <section class="bridge">
    <div class="card paste-card reveal" style="--d:60ms">
      <div class="paste-head">
        <h2 class="card-title" data-i18n="paste.title"></h2>
        <span class="grow"></span>
        <button class="btn btn-ghost btn-sm" id="btnSample" data-i18n="paste.sample"></button>
        <button class="icon-btn help-btn" id="btnTour" aria-haspopup="dialog"
                data-i18n-title="tour.open" aria-label="?">?</button>
      </div>

      <textarea id="inputArea" class="ta" spellcheck="false" dir="ltr" rows="10" wrap="off"
        placeholder="1&#9;-72.4245&#9;-78.8269&#9;-84.1238&#9;NS3373B_LNS3373Da&#9;JW1038J_LJW1038Da&#9;SO5093C_LSO5093Da&#10;2&#9;-76.2232&#9;-82.6274&#9;-88.9477&#9;WE6261D_LWE6261Da&#9;EA2362A_LEA2362Da&#9;EI2402A_LEI2402Da"></textarea>

      <div class="paste-foot">
        <span class="hint" id="pasteHint" data-i18n="hint.waiting"></span>
        <button class="btn btn-primary" id="btnGenerate">
          <span data-i18n="paste.generate"></span>
          <svg class="btn-arrow" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M10 3.5 5.5 8l4.5 4.5" stroke="currentColor" stroke-width="1.6"
                  stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </div>
  </section>
</main>

<!-- ══ DATABASES ══ its own view: the paste is a thing you do every time,
     the databases a thing you look after now and then. ══ -->
<main class="view hidden" id="viewDb">
  <section class="section db-top" id="sectionDb">
    <div class="section-head">
      <p class="eyebrow"><span class="dot"></span><span data-i18n="db.eyebrow"></span></p>
      <h2 class="section-title" data-i18n="db.title"></h2>
      <p class="section-sub" data-i18n="db.sub"></p>
      <button class="btn btn-outline btn-sm ins-open" id="btnInspect"
              data-i18n="ins.open"></button>
    </div>
    <!-- one ruled panel; .db-ledger clips the outermost rules (main.css) -->
    <div class="db-ledger">
      <div class="db-grid" id="dbGrid"><!-- rendered by app.js --></div>
    </div>
  </section>
</main>

<!-- ══ LOOKUP ══ the databases as a reference tool, not only as a step in
     generating a table. Searches all four at once, because a code read off
     Planet does not say which operator it belongs to. ══ -->
<main class="view hidden" id="viewLookup">
  <section class="section lk-top">
    <div class="section-head">
      <p class="eyebrow"><span class="dot"></span><span data-i18n="lk.eyebrow"></span></p>
      <h2 class="section-title" data-i18n="lk.title"></h2>
      <p class="section-sub" data-i18n="lk.sub"></p>
    </div>

    <div class="lk-bar">
      <svg class="lk-ico" viewBox="0 0 18 18" fill="none" aria-hidden="true">
        <circle cx="8" cy="8" r="5.2" stroke="currentColor" stroke-width="1.6"/>
        <path d="M11.8 11.8 16 16" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
      <input class="lk-search" id="lkSearch" type="search" autocomplete="off"
             spellcheck="false" dir="auto" data-i18n-placeholder="lk.search"/>
    </div>

    <div id="lkDirect"><!-- rendered by app.js --></div>
    <div class="lk-list" id="lkList"><!-- rendered by app.js --></div>
  </section>
</main>

<!-- ══ DECKS ══ upload a real .pptx once, mark where the pictures and the
     report table go, then generate the whole presentation from it. The
     template is the uploaded file itself — see js/pptx.js. ══ -->
<main class="view hidden" id="viewDecks">
  <section class="section dk-top">
    <div class="section-head">
      <p class="eyebrow"><span class="dot"></span><span data-i18n="dk.eyebrow"></span></p>
      <h2 class="section-title" data-i18n="dk.title"></h2>
      <p class="section-sub" data-i18n="dk.sub"></p>
    </div>

    <div class="dk-tpls" id="dkTpls"><!-- rendered by deck.js --></div>

    <div class="dk-body hidden" id="dkBody">
      <div class="dk-drop" id="dkDrop">
        <p class="dk-drop-t" data-i18n="dk.dropTitle"></p>
        <p class="dk-drop-s" data-i18n="dk.dropSub"></p>
        <div class="dk-drop-acts">
          <button class="btn btn-ghost btn-sm" id="dkPick" data-i18n="dk.pick"></button>
          <button class="btn btn-ghost btn-sm" id="dkClear" data-i18n="dk.clearImgs"></button>
        </div>
      </div>

      <div class="dk-imgs" id="dkImgs"><!-- rendered by deck.js --></div>

      <div class="dk-out">
        <div class="dk-out-head">
          <h3 class="card-title" data-i18n="dk.planTitle"></h3>
          <span class="dk-count" id="dkCount"></span>
        </div>
        <div id="dkPlan"><!-- rendered by deck.js --></div>
        <div class="dk-foot">
          <button class="btn btn-primary" id="dkBuild">
            <span data-i18n="dk.build"></span>
            <svg class="btn-arrow" viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <path d="M10 3.5 5.5 8l4.5 4.5" stroke="currentColor" stroke-width="1.6"
                    stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </section>
</main>

<!-- ══ TEMPLATE EDITOR ══ marks up a deck; it never retypes its content ══ -->
<div class="ed-overlay hidden" id="tplEditor">
  <div class="ed-modal tpl-modal" role="dialog" aria-modal="true" aria-labelledby="tplHead">
    <header class="ed-head">
      <div class="tpl-head-l">
        <p class="eyebrow"><span class="dot"></span><span data-i18n="dk.editing"></span></p>
        <input class="tpl-name" id="tplName" type="text" autocomplete="off"
               data-i18n-placeholder="dk.namePh"/>
      </div>
      <button class="ab-x" id="tplClose" data-i18n-title="ed.close" aria-label="Close">✕</button>
    </header>

    <div class="tpl-work">
      <aside class="tpl-rail" id="tplRail"><!-- rendered by deck.js --></aside>
      <div class="tpl-main">
        <div class="tpl-bar">
          <button class="btn btn-ghost btn-sm" id="tplAddImg" data-i18n="dk.addImg"></button>
          <button class="btn btn-ghost btn-sm" id="tplAddTbl" data-i18n="dk.addTbl"></button>
          <button class="btn btn-ghost btn-sm" id="tplDelSlot" data-i18n="dk.delSlot"></button>
          <span class="grow"></span>
          <button class="btn btn-ghost btn-sm toggle" id="tplRepeat"
                  data-i18n="dk.repeatSlide" data-i18n-title="dk.repeatHint"></button>
          <span class="tpl-pos" id="tplPos"></span>
        </div>
        <div class="tpl-stage-wrap">
          <div class="tpl-stage" id="tplStage"><!-- rendered by deck.js --></div>
        </div>
        <p class="tpl-hint" data-i18n="dk.stageHint"></p>
      </div>
    </div>

    <footer class="ed-foot">
      <span class="grow"></span>
      <button class="btn btn-ghost" id="tplCancel" data-i18n="ed.cancel"></button>
      <button class="btn btn-primary" id="tplSave" data-i18n="dk.save"></button>
    </footer>
  </div>
</div>

<!-- ══ TABLE ══ -->
<!-- ══ SITE DATA ══ -->
<main class="view hidden" id="viewSite">
  <section class="section sd-top">
    <div class="section-head">
      <p class="eyebrow"><span class="dot"></span><span data-i18n="sd.eyebrow"></span></p>
      <h2 class="section-title" data-i18n="sd.title"></h2>
      <p class="section-sub" data-i18n="sd.sub"></p>
    </div>

    <div class="sd-bar">
      <input class="lk-search" id="sdSearch" type="search" autocomplete="off"
             data-i18n-placeholder="sd.search"/>
    </div>
    <div class="sd-results" id="sdResults"></div>

    <div class="sd-picked" id="sdPicked"></div>

    <div class="sd-actions" id="sdActions">
      <div class="seg" id="sdPer" role="group">
        <button class="seg-btn" data-sd-per="multi" data-i18n="sd.perMulti"></button>
        <button class="seg-btn" data-sd-per="one" data-i18n="sd.perOne"></button>
      </div>
      <!-- the site sheet's own style setting (app.js siteStyle) -->
      <div class="seg out-style" id="styleSite" role="group" data-i18n-title="style.title">
        <button class="seg-btn" data-site-style="classic" data-i18n="style.classic" data-i18n-title="style.classicTitle"></button>
        <button class="seg-btn" data-site-style="clean" data-i18n="style.clean" data-i18n-title="style.cleanTitle"></button>
        <button class="seg-btn" data-site-style="stylish" data-i18n="style.stylish" data-i18n-title="style.stylishTitle"></button>
      </div>
      <span class="grow"></span>
      <button class="btn btn-ghost btn-sm" id="sdClear" data-i18n="sd.clear"></button>
      <button class="btn btn-ghost btn-sm" id="sdPrint" data-i18n="tbl.print"></button>
      <button class="btn btn-primary btn-sm" id="sdPptx" data-i18n="tbl.pptx"></button>
    </div>

    <div class="doc-wrap sd-wrap">
      <div class="doc-shell">
        <div class="doc-page" id="sdPage"></div>
      </div>
    </div>
  </section>
</main>

<!-- ══ NEW SITES ══ a Planet site, copied from any site in the databases.
     The databases' import keeps the clone kit (js/sitegen.js), so there is
     no workbook to load here: search, pick, change, generate. ══ -->
<main class="view hidden" id="viewQuest">
  <section class="section q-top">
    <div class="section-head">
      <p class="eyebrow"><span class="dot"></span><span data-i18n="q.eyebrow"></span></p>
      <h2 class="section-title" data-i18n="q.title"></h2>
      <p class="section-sub" data-i18n="q.sub"></p>
    </div>

    <!-- Saved groups: every group a file was generated from, to open again or
         copy into the next one. Cards like the Decks view's templates. -->
    <div class="q-lib" id="qLib">
      <div class="q-lib-head">
        <h3 class="q-lib-title" data-i18n="q.lib"></h3>
        <span class="q-lib-n" id="qLibN"></span>
      </div>
      <div id="qLibList"><!-- rendered by quest.js --></div>
    </div>

    <!-- Three steps on one rail: each lights its square when it is satisfied,
         and the next one rises in. -->
    <ol class="q-flow">
      <li class="q-step" id="qStep1">
        <span class="q-mark" aria-hidden="true"></span>
        <h3 class="q-h" data-i18n="q.s1"></h3>
        <p class="q-note" data-i18n="q.s1note"></p>

        <div class="q-pick" id="qPickBox">
          <div class="lk-bar">
            <svg class="lk-ico" viewBox="0 0 18 18" fill="none" aria-hidden="true">
              <circle cx="8" cy="8" r="5.2" stroke="currentColor" stroke-width="1.6"/>
              <path d="M11.8 11.8 16 16" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
            <input class="lk-search" id="qPick" type="search" autocomplete="off"
                   spellcheck="false" dir="auto" data-i18n-placeholder="q.pick"/>
          </div>
          <div class="q-results" id="qPickResults"><!-- rendered by quest.js --></div>
        </div>
        <div id="qTmpl"><!-- rendered by quest.js --></div>
      </li>

      <li class="q-step hidden" id="qStep2">
        <span class="q-mark" aria-hidden="true"></span>
        <h3 class="q-h" data-i18n="q.s2"></h3>
        <p class="q-note" data-i18n="q.s2note"></p>
        <div class="q-group-row">
          <input class="q-in q-group" id="qGroup" autocomplete="off" spellcheck="false"
                 dir="auto" data-i18n-placeholder="q.phGroup"/>
          <span class="q-file" id="qFile"></span>
        </div>
        <!-- a copy's origin, or a saved group this name would replace -->
        <p class="q-group-note" id="qGroupNote"></p>
      </li>

      <li class="q-step hidden" id="qStep3">
        <span class="q-mark" aria-hidden="true"></span>
        <div class="q-h-row">
          <h3 class="q-h" data-i18n="q.s3"></h3>
          <span class="grow"></span>
          <span class="q-fmt-label" data-i18n="q.coord"></span>
          <!-- how the נ.צ is typed; motion.js slides the thumb -->
          <div class="seg q-fmt" id="qFmt" role="group" data-i18n-title="q.coordTitle">
            <button class="seg-btn" data-q-fmt="geo" data-i18n="q.geo"></button>
            <button class="seg-btn" data-q-fmt="utm" data-i18n="q.utm"></button>
          </div>
        </div>
        <p class="q-note" data-i18n="q.s3note"></p>

        <div class="q-rows" id="qRows"><!-- rendered by quest.js --></div>

        <div class="q-foot">
          <button class="btn btn-ghost btn-sm" id="qAdd">
            <span class="ed-plus" aria-hidden="true">+</span>
            <span data-i18n="q.add"></span>
          </button>
          <span class="q-count" id="qCount"></span>
          <span class="grow"></span>
          <button class="btn btn-primary" id="qGo">
            <span data-i18n="q.go"></span>
            <svg class="btn-arrow" viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <path d="M10 3.5 5.5 8l4.5 4.5" stroke="currentColor" stroke-width="1.6"
                    stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
        <p class="q-after hidden" id="qAfter" data-i18n="q.after"></p>
      </li>
    </ol>
  </section>
</main>

<!-- The antenna list, one for the whole view; quest.js places it under
     whichever antenna field has focus. Outside the view on purpose: a view
     arrives with a transform, and a transformed ancestor would make this
     fixed-position list measure from the wrong corner. -->
<div class="q-ac hidden" id="qAc" role="listbox"></div>

<main class="view hidden" id="viewTable">
  <div class="toolbar">
    <div class="toolbar-inner">
      <button class="btn btn-ghost btn-sm" id="btnBack">
        <svg class="btn-arrow flip" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M10 3.5 5.5 8l4.5 4.5" stroke="currentColor" stroke-width="1.6"
                stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span data-i18n="tbl.back"></span>
      </button>
      <span class="toolbar-meta" id="tableMeta"></span>
      <span class="toolbar-edit hidden" id="editNote"></span>
      <span class="grow"></span>
      <!-- output style: one setting, kept per machine (app.js "output styles") -->
      <div class="seg out-style" id="styleTable" role="group" data-i18n-title="style.title">
        <button class="seg-btn" data-out-style="classic" data-i18n="style.classic" data-i18n-title="style.classicTitle"></button>
        <button class="seg-btn" data-out-style="clean" data-i18n="style.clean" data-i18n-title="style.cleanTitle"></button>
        <button class="seg-btn" data-out-style="coverage" data-i18n="style.coverage" data-i18n-title="style.coverageTitle"></button>
      </div>
      <button class="btn btn-ghost btn-sm hidden" id="btnRevert" data-i18n="tbl.revert"></button>
      <button class="btn btn-ghost btn-sm" id="btnPrint" data-i18n="tbl.print"></button>
      <button class="btn btn-primary btn-sm" id="btnPptx" data-i18n="tbl.pptx"></button>
    </div>
  </div>

  <div class="doc-wrap">
    <div class="doc-shell">
      <div class="notice hidden" id="missNotice">
        <svg class="notice-ico" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <circle cx="8" cy="8" r="6.4" stroke="currentColor" stroke-width="1.4"/>
          <path d="M8 4.8v3.6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          <circle cx="8" cy="11" r=".85" fill="currentColor"/>
        </svg>
        <div>
          <strong id="missTitle"></strong>
          <div class="notice-body" id="missBody"></div>
        </div>
      </div>
      <div id="docPage" class="doc-page"></div>
    </div>
  </div>
</main>

<!-- The page's floor, under EVERY view, so the footer (and its credit) is on
     every page. On home it is the network at night with the footer standing
     on its ground (js/scene.js); everywhere else main.css collapses it to the
     footer alone, on the page's cream. It must come AFTER the views: the CSS
     reads which view is open through `#viewHome.hidden ~ .floor`. -->
<div class="floor">
  <div class="scene-host" id="sceneHost" aria-hidden="true"></div>
  <footer class="foot">
    <span>TableX</span>
    <span class="foot-sep">·</span>
    <span data-i18n="foot.tag"></span>
    <span class="grow"></span>
    <button class="credit" id="btnAbout" data-i18n="foot.credit" data-i18n-title="foot.creditTitle"></button>
  </footer>
</div>

<!-- ══ SITE EDITOR ══ per-site add/remove, so a one-site change needs no xlsx ══ -->
<div class="ed-overlay hidden" id="dbEditor">
  <div class="ed-modal" role="dialog" aria-modal="true" aria-labelledby="edTitle">

    <header class="ed-head">
      <div>
        <p class="eyebrow"><span class="dot"></span><span id="edNet"></span></p>
        <h2 class="ed-title" id="edTitle" data-i18n="ed.title"></h2>
        <p class="ed-count" id="edCount"></p>
      </div>
      <button class="ab-x" id="edClose" data-i18n-title="ed.close" aria-label="Close">✕</button>
    </header>

    <div class="ed-bar">
      <input class="ed-search" id="edSearch" type="search" autocomplete="off"
             data-i18n-placeholder="ed.search"/>
      <button class="btn btn-primary btn-sm" id="edAddToggle">
        <span class="ed-plus" aria-hidden="true">+</span>
        <span data-i18n="ed.add"></span>
      </button>
    </div>

    <!-- add form, collapsed by default -->
    <form class="ed-add hidden" id="edAdd" autocomplete="off">
      <p class="set-label" data-i18n="ed.addTitle"></p>
      <div class="ed-grid">
        <label class="ed-field">
          <span data-i18n="ed.sectorId"></span>
          <input id="edSectorId" dir="ltr" required/>
        </label>
        <label class="ed-field">
          <span data-i18n="ed.siteId"></span>
          <input id="edSiteId" dir="ltr" required/>
        </label>
        <label class="ed-field ed-wide">
          <span data-i18n="ed.siteName"></span>
          <input id="edSiteName"/>
        </label>
        <label class="ed-field">
          <span data-i18n="ed.sector"></span>
          <input id="edSector" dir="ltr"/>
        </label>
        <label class="ed-field">
          <span data-i18n="ed.freq"></span>
          <input id="edFreq" dir="ltr" inputmode="decimal"/>
        </label>
        <label class="ed-field">
          <span data-i18n="ed.bw"></span>
          <input id="edBw" dir="ltr" inputmode="decimal"/>
        </label>
      </div>
      <div class="ed-add-foot">
        <button type="button" class="btn btn-ghost btn-sm" id="edAddCancel" data-i18n="ed.cancel"></button>
        <button type="submit" class="btn btn-primary btn-sm" data-i18n="ed.submit"></button>
      </div>
    </form>

    <div class="ed-list" id="edList"></div>

    <footer class="ed-foot">
      <span class="ed-dirty" id="edDirty"></span>
      <span class="grow"></span>
      <button class="btn btn-ghost btn-sm" id="edCancel" data-i18n="ed.cancel"></button>
      <button class="btn btn-primary btn-sm" id="edSave" disabled data-i18n="ed.save"></button>
    </footer>
  </div>
</div>

<!-- ══ WORKBOOK INSPECTOR ══ -->
<div class="ed-overlay hidden" id="dbInspect">
  <div class="ed-modal ins-modal" role="dialog" aria-modal="true" aria-labelledby="insTitle">

    <header class="ed-head">
      <div>
        <p class="eyebrow"><span class="dot"></span><span class="mono" id="insFile"></span></p>
        <h2 class="ed-title" id="insTitle" data-i18n="ins.title"></h2>
        <p class="ed-count" id="insCount"></p>
      </div>
      <button class="ab-x" id="insClose" data-i18n-title="ed.close" aria-label="Close">✕</button>
    </header>

    <div class="ed-bar">
      <span class="ins-hint" data-i18n="ins.hint"></span>
      <span class="grow"></span>
      <button class="btn btn-ghost btn-sm" id="insAll" data-i18n="ins.expandAll"></button>
    </div>

    <div class="ed-list" id="insList"></div>
  </div>
</div>

<!-- ══ ABOUT THE BUILDER ══ -->
<div class="ab-overlay hidden" id="aboutModal">
  <div class="ab-modal card" role="dialog" aria-modal="true" aria-labelledby="abName">
    <button class="ab-x" id="btnAboutClose" data-i18n-title="about.close" aria-label="Close">✕</button>

    <div class="ab-head">
      <div class="ab-photo-wrap">
        <img class="ab-photo" src="img/elad.jpg" alt="Elad Pinhasov"
             onerror="this.hidden=true;this.nextElementSibling.hidden=false"/>
        <div class="ab-photo-fallback" hidden>EP</div>
      </div>
      <div>
        <p class="eyebrow ab-eyebrow"><span class="dot"></span>
          <span dir="ltr">TableX · RF planning · Planet 7.10</span>
        </p>
        <h2 class="ab-name" id="abName" dir="ltr">Elad Pinhasov</h2>
        <p class="ab-role" data-i18n="about.role"></p>
      </div>
    </div>

    <ul class="ab-facts" id="abFacts"></ul>

    <blockquote class="ab-quote" data-i18n="about.quote"></blockquote>

    <div class="ab-foot">
      <span class="ab-stat"><strong>16,510</strong> <span data-i18n="about.stat1"></span></span>
      <span class="ab-stat"><strong>~20</strong> <span data-i18n="about.stat2"></span></span>
      <span class="ab-stat"><strong data-i18n="about.stat3n"></strong> <span data-i18n="about.stat3"></span></span>
    </div>
  </div>
</div>

<!-- ══ TOUR ══ the "?" on the paste card: Planet -> paste -> table, one
     step at a time. Filled by js/tour.js. ══ -->
<div class="ed-overlay hidden" id="tourOverlay">
  <div class="tour-modal" role="dialog" aria-modal="true" aria-labelledby="tourTitle">
    <header class="tour-head">
      <div class="tour-bar" id="tourBar"></div>
      <button class="ab-x" id="tourClose" data-i18n-title="ed.close" aria-label="Close">✕</button>
    </header>
    <div class="tour-stage" id="tourStage"></div>
    <footer class="tour-foot">
      <span class="tour-count" id="tourCount"></span>
      <span class="grow"></span>
      <button class="btn btn-ghost btn-sm" id="tourPrev" data-i18n="tour.prev"></button>
      <button class="btn btn-primary btn-sm" id="tourNext"></button>
    </footer>
  </div>
</div>

<!-- ══ CONFIRM ══ in-app replacement for window.confirm(), which renders as
     "localhost:8094 says" — the browser's voice, not the app's, and in the
     packaged exe it would be Electron's chrome instead of TableX's ══ -->
<div class="ed-overlay hidden" id="askOverlay">
  <div class="ask-modal" role="alertdialog" aria-modal="true"
       aria-labelledby="askTitle" aria-describedby="askBody">
    <h2 class="ask-title" id="askTitle"></h2>
    <div class="ask-body" id="askBody"></div>
    <div class="ask-actions">
      <button class="btn btn-outline btn-sm" id="askNo"></button>
      <button class="btn btn-primary btn-sm" id="askYes"></button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="js/i18n.js"></script>
<script src="js/xlsx.full.min.js"></script>
<!-- Also loaded as a Worker by app.js; as a plain script it only exposes
     TableXParse, the main-thread fallback if a Worker cannot start. -->
<script src="js/dbparse.js"></script>
<script src="js/pptxgen.bundle.js"></script>
<!-- after pptxgen: that bundle is where JSZip comes from -->
<script src="js/pptx.js"></script>
<script src="js/scene.js"></script>
<script src="js/app.js"></script>
<!-- after app.js: deck.js uses the TableXUI / TableXReport bridges it exposes -->
<script src="js/deck.js"></script>
<script src="js/sitegen.js"></script>
<script src="js/geo.js"></script>
<!-- after app.js (the TableXDB / TableXUI bridges), sitegen.js and geo.js -->
<script src="js/quest.js"></script>
<!-- the shared press / rings / sliding-indicator layer; depends on nothing -->
<script src="js/motion.js"></script>
<!-- the "?" walkthrough; reads I18N and presses #btnSample, nothing else -->
<script src="js/tour.js"></script>
<!-- the ghost that peeks from behind the cards; reads SCENE.GH (the mark) -->
<script src="js/peek.js"></script>
</body>
</html>
